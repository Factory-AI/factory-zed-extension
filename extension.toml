id = "factory-droid"
name = "Factory Droid"
version = "0.57.17"
schema_version = 1
description = "Factory Droid - AI coding agent powered by Factory AI"
authors = ["Factory AI"]
repository = "https://github.com/Factory-AI/factory-zed-extension"

[agent_servers.Droid]
name = "Factory Droid"
icon = "droid-zed.svg"

[agent_servers.Droid.env]
DROID_DISABLE_AUTO_UPDATE = "true"
FACTORY_DROID_AUTO_UPDATE_ENABLED = "false"

[agent_servers.Droid.targets.darwin-aarch64]
archive = "https://downloads.factory.ai/factory-cli/releases/0.57.17/droid-darwin-aarch64.tar.gz"
cmd = "./droid"
args = ["exec", "--output-format", "acp"]
sha256 = "71550e224fc5f1cc116a478abe0254ebeaa63e6024f49945552d595acdc2d47a"

