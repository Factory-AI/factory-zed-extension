id = "factory-droid"
name = "Factory Droid"
version = "0.66.0"
schema_version = 1
description = "Factory Droid - AI coding agent powered by Factory AI"
authors = ["Factory AI"]
repository = "https://github.com/Factory-AI/factory-zed-extension"

[agent_servers.Droid]
name = "Factory Droid"
icon = "droid-zed.svg"

[agent_servers.Droid.env]
DROID_DISABLE_AUTO_UPDATE = "true"
FACTORY_DROID_AUTO_UPDATE_ENABLED = "false"

[agent_servers.Droid.targets.darwin-aarch64]
archive = "https://downloads.factory.ai/factory-cli/releases/0.66.0/droid-darwin-aarch64.tar.gz"
cmd = "./droid"
args = ["exec", "--output-format", "acp"]
sha256 = "3dbba0fb75ed807997104826e342b442ea8011a49ff1a0fd50f2e1cd1c877f0b"

