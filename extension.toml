id = "factory-droid"
name = "Factory Droid"
version = "0.57.9"
schema_version = 1
description = "Factory Droid - AI coding agent powered by Factory AI"
authors = ["Factory AI"]
repository = "https://github.com/Factory-AI/factory-zed-extension"

[agent_servers.Droid]
name = "Factory Droid"
icon = "droid-zed.svg"

[agent_servers.Droid.env]
DROID_DISABLE_AUTO_UPDATE = "true"
FACTORY_DROID_AUTO_UPDATE_ENABLED = "false"

[agent_servers.Droid.targets.darwin-aarch64]
archive = "https://downloads.factory.ai/factory-cli/releases/0.57.9/droid-darwin-aarch64.tar.gz"
cmd = "./droid"
args = ["exec", "--output-format", "acp"]
sha256 = "118acd4b8440b4504059e1b79ddb7c9485cac782361e8425a8d19e23fe1da99f"

