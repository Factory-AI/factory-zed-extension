id = "factory-droid"
name = "Factory Droid"
version = "0.57.5"
schema_version = 1
description = "Factory Droid - AI coding agent powered by Factory AI"
authors = ["Factory AI"]
repository = "https://github.com/Factory-AI/factory-zed-extension"

[agent_servers.Droid]
name = "Factory Droid"
icon = "droid-zed.svg"

[agent_servers.Droid.env]
DROID_DISABLE_AUTO_UPDATE = "true"
FACTORY_DROID_AUTO_UPDATE_ENABLED = "false"

[agent_servers.Droid.targets.darwin-aarch64]
archive = "https://downloads.factory.ai/factory-cli/releases/0.57.5/droid-darwin-aarch64.tar.gz"
cmd = "./droid"
args = ["exec", "--output-format", "acp"]
sha256 = "af5508610543173d872d167b83f6635019195d6fd0c0948a4cf6c5b1b5b4efca"

